<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G.K. Chesterton Quote</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        background: #f4f1ea;
        color: #1f1f1f;
        font-family: Georgia, "Times New Roman", serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 8vw;
    }

    .quote-container {
        max-width: 1500px;
        text-align: center;
    }

    .quote {
        font-size: clamp(3rem, 7vw, 8rem);
        line-height: 1.12;
        font-weight: 400;
        letter-spacing: -0.03em;
        margin: 0 0 0.6em;
    }

    .attribution {
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(1.2rem, 2vw, 2.5rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #777;
    }

    .author {
        color: #333;
    }

    .source {
        font-style: italic;
    }

    .divider {
        margin: 0 0.4em;
        color: #aaa;
    }
</style>
</head>

<body>

<div class="quote-container">

    <p class="quote">
        “If a thing is worth doing,<br>
        it is worth doing badly.”
    </p>

    <div class="attribution">
        <span class="author">G.K. Chesterton</span>
        <span class="divider">—</span>
        <span class="source">What’s Wrong with the World</span>
    </div>

</div>

</body>
</html>
