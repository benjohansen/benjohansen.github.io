<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Course Introduction</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
    }

    body {
        background: #f4f1ea;
        color: #1f1f1f;
        font-family: Georgia, "Times New Roman", serif;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 8vw;
    }

    .slide {
        max-width: 1500px;
        width: 100%;
        text-align: center;
        cursor: pointer;
        user-select: none;
    }

    .content {
        transition: opacity 0.45s ease;
    }

    .fade-out {
        opacity: 0;
    }

  .intro {
    font-size: clamp(2.2rem, 4.5vw, 5.8rem);
    line-height: 1.35;
    font-weight: 400;
    letter-spacing: -0.02em;
}

    .quote {
        font-size: clamp(3rem, 7vw, 8rem);
        line-height: 1.12;
        font-weight: 400;
        letter-spacing: -0.03em;
        margin-bottom: 0.6em;
    }

    .attribution {
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(1.2rem, 2vw, 2.5rem);
        font-weight: 500;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #777;
    }

    .author {
        color: #333;
    }

    .source {
        font-style: italic;
    }

    .divider {
        margin: 0 0.4em;
        color: #aaa;
    }
</style>
</head>

<body>

<div class="slide" id="slide">

    <div class="content" id="content">

        <div class="intro">
            You've just stepped into a whole new world.
            This course is your guide for navigating it well,
            helping you not just survive but flourish and be
            formed in every aspect of who you are.
        </div>

    </div>

</div>

<script>
    const slide = document.getElementById("slide");
    const content = document.getElementById("content");

    let showingQuote = false;

    const intro = `
        <div class="intro">
            You've just stepped into a whole new world.
            This course is your guide for navigating it well,
            helping you not just survive but flourish and be
            formed in every aspect of who you are.
        </div>
    `;

    const quote = `
        <div class="quote">
            “If a thing is worth doing,<br>
            it is worth doing badly.”
        </div>

        <div class="attribution">
            <span class="author">G.K. Chesterton</span>
            <span class="divider">—</span>
            <span class="source">What’s Wrong with the World</span>
        </div>
    `;

    slide.addEventListener("click", () => {

        content.classList.add("fade-out");

        setTimeout(() => {

            showingQuote = !showingQuote;

            content.innerHTML = showingQuote ? quote : intro;

            content.classList.remove("fade-out");

        }, 450);

    });
</script>

</body>
</html>
